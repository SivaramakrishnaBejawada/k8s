apiVersion: v1
kind: ReplicationController
metadata:
  name: myapp-rc
  labels: 
    app: myapp
    type: frontend
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        app: myapp
        type: frontend
    spec:
      containers:
      - name: nginx
        image: nginx
      - name: busybox
        image: busybox
        command: ["sh", "-c", "sleep 3600"]
  replicas: 3